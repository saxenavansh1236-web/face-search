<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register — Face Search Tool</title>
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-badge">✨</div>
      <h1>Create Account</h1>
      <p class="sub">Register to access the Face Search Tool API docs</p>

      {% if error %}
      <div class="error-banner">{{ error }}</div>
      {% endif %}

      <form method="post" action="/register">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" minlength="3" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" minlength="6" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" minlength="6" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <p class="sub" style="margin-top:18px;">
        Already have an account? <a href="/login" style="color:var(--accent);">Sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
